<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropverse Point</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:linear-gradient(160deg,#080b20,#29104c);
  color:white;font-family:Arial,sans-serif;text-align:center;
}
.app{max-width:430px;margin:auto;padding:24px 18px}
h1{color:#c4b5fd;font-size:24px}
.subtitle{color:#b9a8ec}
.card{
  background:#ffffff0d;border:1px solid #6651a6;
  border-radius:20px;padding:20px;margin-top:28px;
}
.label{color:#c4b5fd}
#balance{font-size:35px;font-weight:bold;margin:12px}
#coin{
  width:185px;height:185px;border-radius:50%;margin:32px auto;
  border:7px solid #e9d5ff;
  background:radial-gradient(circle at 35% 25%,white,#a78bfa 38%,#6d28d9 80%);
  color:white;font-size:34px;font-weight:bold;
  box-shadow:0 0 35px #8b5cf688;cursor:pointer;
}
#coin:active{transform:scale(.94)}
.energy{margin:20px 0;text-align:left}
.track{height:12px;background:#44305e;border-radius:12px;overflow:hidden;margin-top:10px}
#bar{height:100%;width:100%;background:#facc15}
button{cursor:pointer}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu button,.reward{
  border:1px solid #6651a6;background:#291747;
  color:white;padding:13px 5px;border-radius:12px;
}
.reward{background:#7c3aed;margin:15px 0}
#message{color:#c4b5fd;min-height:22px;margin-top:15px}
footer{font-size:12px;color:#9ca3af;margin-top:30px}
</style>
</head>
<body>
<main class="app">
  <h1>💎 DRO PVERSE POINT</h1>
  <div class="subtitle">TAP • EARN • EXPLORE</div>
  <section class="card">
    <div class="label">YOUR BALANCE</div>
    <div id="balance">0 DVP</div>
    <div id="user">Welcome, Player!</div>
  </section>

DVP

  <div>Tap to collect points!</div>
  <section class="energy">
    ⚡ Energy: <span id="energy">1000</span>/1000
    <div class="track"><div id="bar"></div></div>
  </section>

🎁 Daily Reward

  <nav class="menu">
    <button data-page="home">🏠 Home</button>
    <button data-page="friends">👥 Friends</button>
    <button data-page="rank">🏆 Rank</button>
  </nav>
  <div id="message"></div>
  <footer>Dropverse Point © 2026</footer>
</main>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
let points = 0;
let energy = 1000;
const maxEnergy = 1000;
let lastReward = "";
const $ = id => document.getElementById(id);
const savedUser = tg?.initDataUnsafe?.user;
if (savedUser) {
  $("user").textContent = "Welcome, " + savedUser.first_name + "!";
}
function render() {
  $("balance").textContent = points.toLocaleString() + " DVP";
  $("energy").textContent = energy;
  $("bar").style.width = (energy / maxEnergy * 100) + "%";
}
$("coin").addEventListener("click", () => {
  if (energy < 1) {
    $("message").textContent = "⚡ Wait for energy recharge!";
    return;
  }
  points += 1;
  energy -= 1;
  $("message").textContent = "+1 DVP";
  tg?.HapticFeedback?.impactOccurred("light");
  render();
});
$("daily").addEventListener("click", () => {
  const today = new Date().toISOString().slice(0, 10);
  if (lastReward === today) {
    $("message").textContent = "Daily reward already collected!";
    return;
  }
  lastReward = today;
  points += 100;
  $("message").textContent = "🎉 Demo reward: +100 DVP";
  render();
});
document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => {
    const page = button.dataset.page;
    if (page === "home") {
      $("message").textContent = "Welcome to Dropverse Point!";
    } else if (page === "friends") {
      $("message").textContent = "Referral system: coming soon!";
    } else {
      $("message").textContent = "Leaderboard: coming soon!";
    }
  });
});
setInterval(() => {
  if (energy < maxEnergy) {
    energy = Math.min(maxEnergy, energy + 1);
    render();
  }
}, 3000);
render();
</script>
</body>
</html>
