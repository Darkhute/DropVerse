<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DropVerse</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f5f9;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            max-width: 400px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🚀 DropVerse</h1>

    <p>Complete Tasks. Earn Points. Get Rewards.</p>

    <h2>🪙 0 DVP</h2>

    <button>🎯 Tasks</button>
    <button>👥 Refer Friends</button>
    <button>🏆 Leaderboard</button>
    <button>💰 Rewards</button>

</div>

</body>
</html>
