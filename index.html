
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dropverse Point</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="12022818" data-sdk="show_12022818"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#080b20,#211044);color:white;font-family:Arial,sans-serif;text-align:center;user-select:none}
.app{max-width:430px;margin:auto;padding:20px 16px 35px}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:19px;font-weight:bold;color:#c4b5fd}
.avatar{background:#302052;border-radius:50%;padding:12px}
.card{background:rgba(255,255,255,.06);border:1px solid #574481;border-radius:18px;padding:18px;margin-top:22px}
.small{color:#b7a9dd;font-size:13px}
.balance{font-size:35px;font-weight:bold;margin:10px}
.coin-area{padding:20px 0}
#coin{width:205px;height:205px;border-radius:50%;border:8px solid #e9d5ff;background:radial-gradient(circle at 32% 25%,#fff,#b9a0ff 28%,#8147df 65%,#48218c);box-shadow:0 0 25px #9565ff,inset 0 -8px 15px #3a176d;color:white;font-size:36px;font-weight:bold;cursor:pointer;touch-action:manipulation;transition:transform .08s}
#coin:active{transform:scale(.94)}
#coin:disabled{opacity:.6}
.energy-head{display:flex;justify-content:space-between;font-size:14px}
.track{height:11px;background:#38284e;border-radius:10px;overflow:hidden;margin-top:10px}
#energyBar{height:100%;width:100%;background:linear-gradient(90deg,#facc15,#f97316)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px}
.tile{border:1px solid #574481;border-radius:14px;background:#211638;padding:15px 4px;color:white;font-size:12px;cursor:pointer}
.tile span{display:block;font-size:23px;margin-bottom:7px}
#content{margin-top:15px;background:#ffffff08;border-radius:15px;padding:15px;min-height:60px;overflow-wrap:anywhere}
button{font-family:inherit}
#message{min-height:22px;color:#c4b5fd;font-size:13px;margin-top:12px;overflow-wrap:anywhere}
footer{color:#82769d;font-size:11px;margin-top:24px}
</style>
</head>
<body>
<main class="app">
<header class="header">
 <div class="logo">💎 DROPVERSE</div>
 <div class="avatar">👤 <span id="username">Player</span></div>
</header>

<section class="card">
 <div class="small">YOUR TOTAL BALANCE</div>
 <div class="balance"><span id="points">0</span> <span style="font-size:16px">DVP</span></div>
 <div class="small">Keep tapping to collect points!</div>
</section>

<section class="coin-area">
 <button id="coin" aria-label="Tap to earn">DVP</button>
 <p>✨ TAP TO EARN ✨</p>
</section>

<section class="card">
 <div class="energy-head">
  <span>⚡ Energy</span>
  <span><b id="energy">0</b> / <span id="maxEnergy">1000</span></span>
 </div>
 <div class="track"><div id="energyBar"></div></div>
</section>

<nav class="grid">
 <button class="tile" data-page="home"><span>🏠</span>Home</button>
 <button class="tile" data-page="tasks"><span>📋</span>Tasks</button>
 <button class="tile" data-page="daily"><span>🎁</span>Daily Reward</button>
 <button class="tile" data-page="friends"><span>👥</span>Friends</button>
 <button class="tile" data-page="rank"><span>🏆</span>Leaderboard</button>
 <button class="tile" data-page="profile"><span>👤</span>Profile</button>
</nav>

<section id="content">
 <h3>Welcome to Dropverse Point!</h3>
 <p class="small">Connecting to your account...</p>
</section>
<div id="message">Connecting...</div>
<footer>DROPVERSE POINT © 2026</footer>
</main>

<script>
"use strict";

const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API_URL = "https://uotdwlkodcmwpsbuimfb.supabase.co/functions/v1/dropverse-game";
const SUPABASE_KEY = "sb_publishable_x7a_qp-lzeHsisq8XDv08g_Kunzq169";

const MAX_ENERGY_DEFAULT = 1000;
const $ = id => document.getElementById(id);

let points = 0;
let energy = 0;
let maxEnergy = MAX_ENERGY_DEFAULT;
let energyBase = 0;
let energyBaseAt = Date.now();
let localTapOffset = 0;
let player = null;
let busy = false;
let pendingTaps = 0;
let tapTimer = null;
let isReady = false;

const initData = tg?.initData || "";

function message(text) {
  $("message").textContent = text;
}

function currentEnergy() {
  const elapsed = Math.max(0, Date.now() - energyBaseAt);
  const regen = Math.floor(elapsed / 3000);
  return Math.max(0, Math.min(maxEnergy, energyBase - localTapOffset + regen));
}

function refreshEnergyDisplay() {
  if (!isReady) return;
  energy = currentEnergy();
  render();
}

setInterval(refreshEnergyDisplay, 1000);

function render() {
  $("points").textContent = Number(points).toLocaleString();
  $("energy").textContent = Math.max(0, Math.floor(energy));
  $("maxEnergy").textContent = maxEnergy;
  $("energyBar").style.width =
    Math.max(0, Math.min(100, energy / maxEnergy * 100)) + "%";
  $("coin").disabled = !isReady || energy <= 0;
}

function findPlayerObject(value, depth = 0) {
  if (depth > 5 || value == null) return null;

  if (Array.isArray(value)) {
    for (const item of value) {
      const found = findPlayerObject(item, depth + 1);
      if (found) return found;
    }
    return null;
  }

  if (typeof value !== "object") return null;

  if (
    value.points !== undefined &&
    value.energy !== undefined
  ) {
    return value;
  }

  for (const key of ["player", "profile", "data", "result"]) {
    if (value[key] !== undefined) {
      const found = findPlayerObject(value[key], depth + 1);
      if (found) return found;
    }
  }

  return null;
}

async function api(action, extra = {}) {
  if (!initData) {
    throw new Error(
      "Open Dropverse Point from its Telegram Mini App button first."
    );
  }

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify({
      action,
      initData,
      ...extra
    })
  });

  const text = await response.text();
  let result;

  try {
    result = text ? JSON.parse(text) : {};
  } catch {
    throw new Error("The server returned an unreadable response.");
  }

  if (!response.ok || result.error || result.success === false) {
    throw new Error(
      result.error || result.message || `Request failed (${response.status})`
    );
  }

  return result;
}

async function loadProfile(showMessage = false) {
  const result = await api("profile");
  const p = findPlayerObject(result);

  if (!p) {
    throw new Error("Profile data was not found in the API response.");
  }

  player = p;
  points = Number(p.points) || 0;
  maxEnergy = Number(p.max_energy) || MAX_ENERGY_DEFAULT;
  energyBase = Math.max(0, Number(p.energy) || 0);

  const lastUpdate = Date.parse(p.last_energy_update || "");
  energyBaseAt = Number.isFinite(lastUpdate) ? lastUpdate : Date.now();
  localTapOffset = 0;
  energy = currentEnergy();

  $("username").textContent =
    p.username || tg?.initDataUnsafe?.user?.first_name || "Player";

  isReady = true;
  render();

  if (showMessage) message("✅ Account synced with the server.");
  return p;
}

async function flushTaps() {
  if (busy || pendingTaps <= 0) return;

  busy = true;
  clearTimeout(tapTimer);

  try {
    while (pendingTaps > 0) {
      const batch = Math.min(10, pendingTaps);
      pendingTaps -= batch;

      try {
        await api("tap", { taps: batch });
        await loadProfile();
        message("✅ Your points have been saved.");
      } catch (error) {
        pendingTaps = 0;
        await loadProfile().catch(() => {});
        throw error;
      }
    }
  } catch (error) {
    message("⚠️ " + error.message);
  } finally {
    busy = false;
    render();
    if (pendingTaps > 0) {
      tapTimer = setTimeout(flushTaps, 200);
    }
  }
}

$("coin").addEventListener("click", () => {
  if (!isReady) {
    message("Please wait for your account to load.");
    return;
  }

  if (energy <= 0) {
    message("⚡ No energy available. Try again after recharge.");
    return;
  }

  localTapOffset += 1;
  energy = currentEnergy();
  pendingTaps += 1;
  render();
  message("Saving your taps...");
  tg?.HapticFeedback?.impactOccurred("light");

  clearTimeout(tapTimer);
  if (pendingTaps >= 10) {
    flushTaps();
  } else {
    tapTimer = setTimeout(flushTaps, 250);
  }
});

async function claimDaily() {
  try {
    message("Claiming your daily reward...");
    const result = await api("daily-reward");
    await loadProfile();

    message(
      result.message ||
      "🎉 Daily reward request completed. Your balance is updated."
    );
  } catch (error) {
    message("⚠️ " + error.message);
  }
}

async function renderTasks(content) {
  content.innerHTML = "<h3>📋 Tasks</h3><p class='small'>Loading tasks...</p>";
  try {
    const response = await fetch("https://uotdwlkodcmwpsbuimfb.supabase.co/rest/v1/dvp_tasks?select=id,title,description,reward,target_url,task_type&is_active=eq.true&task_type=eq.telegram_join&order=id.asc", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!response.ok) throw new Error("Could not load tasks (" + response.status + ")");
    const tasks = await response.json();
    content.replaceChildren();
    const title = document.createElement("h3"); title.textContent = "📋 Tasks"; content.appendChild(title);
    if (!tasks.length) {
      const empty = document.createElement("p"); empty.className = "small"; empty.textContent = "No active tasks available yet."; content.appendChild(empty); return;
    }
    for (const task of tasks) {
      const card = document.createElement("div");
      card.style.cssText = "padding:12px;margin:10px 0;border:1px solid #574481;border-radius:12px;text-align:left;background:#211638";
      const heading = document.createElement("b"); heading.textContent = task.title || "Telegram task";
      const desc = document.createElement("p"); desc.className = "small"; desc.textContent = (task.description || "Complete this task") + " · Reward: " + (Number(task.reward)||10) + " DVP";
      const join = document.createElement("button"); join.textContent = "Join Telegram"; join.style.cssText = "padding:10px;border:0;border-radius:9px;background:#6d28d9;color:white;margin:4px;cursor:pointer";
      join.onclick = () => { if (task.target_url) window.open(task.target_url, "_blank"); else message("Task link is not configured."); };
      const claim = document.createElement("button"); claim.textContent = "Verify & Claim"; claim.style.cssText = "padding:10px;border:1px solid #8b5cf6;border-radius:9px;background:#302052;color:white;margin:4px;cursor:pointer";
      claim.onclick = async () => {
        if (!initData) {
          message("⚠️ Open this Mini App from Telegram first.");
          return;
        }

        claim.disabled = true;
        claim.textContent = "Checking...";
        message("Checking your @dropversecommunity membership...");

        try {
          const response = await fetch(
            "https://uotdwlkodcmwpsbuimfb.supabase.co/functions/v1/dvp-claim-task",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },
              body: JSON.stringify({
                initData: initData,
                taskId: Number(task.id)
              })
            }
          );

          const responseText = await response.text();
          let data = {};
          try {
            data = responseText ? JSON.parse(responseText) : {};
          } catch {
            throw new Error("Server returned an unreadable response (HTTP " + response.status + ").");
          }

          if (!response.ok || data.error || data.success === false) {
            throw new Error(
              data.message || data.error ||
              ("Claim failed (HTTP " + response.status + "). Check Supabase Function Logs.")
            );
          }

          await loadProfile();
          message(data.message || ("Reward claimed: " + (data.reward || task.reward) + " DVP"));
          claim.textContent = "Claimed";
        } catch (error) {
          console.error("Community task claim failed:", error);
          message("⚠️ " + (error?.message || "Claim failed. Check Supabase Function Logs."));
          claim.disabled = false;
          claim.textContent = "Verify & Claim";
        }
      };
      card.append(heading, desc, join, claim); content.appendChild(card);
    }
  } catch (e) { content.innerHTML = "<h3>📋 Tasks</h3><p class='small'>Could not load tasks: " + e.message + "</p><p class='small'>Check the Supabase table and function deployment.</p>"; }
}

async function showLeaderboard(content) {
  content.innerHTML =
    "<h3>🏆 Leaderboard</h3><p class='small'>Loading rankings...</p>";

  try {
    const result = await api("leaderboard");
    const rows = Array.isArray(result)
      ? result
      : (result.leaderboard || result.players || result.data || []);

    if (!Array.isArray(rows) || rows.length === 0) {
      content.innerHTML =
        "<h3>🏆 Leaderboard</h3><p class='small'>No rankings available yet.</p>";
      return;
    }

    content.innerHTML = "<h3>🏆 Leaderboard</h3>";

    rows.slice(0, 50).forEach((row, index) => {
      const item = document.createElement("p");
      item.className = "small";
      const name = row.username || "Player";
      const score = Number(row.points) || 0;
      item.textContent =
        `${index + 1}. ${name} — ${score.toLocaleString()} DVP`;
      content.appendChild(item);
    });
  } catch (error) {
    content.innerHTML = "<h3>🏆 Leaderboard</h3>";
    const p = document.createElement("p");
    p.className = "small";
    p.textContent = "Could not load rankings: " + error.message;
    content.appendChild(p);
  }
}

function showPage(page) {
  const content = $("content");
  content.replaceChildren();

  if (page === "home") {
    content.innerHTML =
      "<h3>🏠 Home</h3><p class='small'>Tap the coin and collect  points!</p>";
  } else if (page === "tasks") {
    renderTasks(content);
  } else if (page === "daily") {
    content.innerHTML =
      "<h3>🎁 Daily Reward</h3><p class='small'>Claim your daily reward from the server.</p>";

    const button = document.createElement("button");
    button.className = "tile";
    button.textContent = "🎁 Claim Daily Reward";
    button.style.cssText = "width:100%;margin:8px 0;padding:13px;border-radius:12px;border:1px solid #8b5cf6;background:#6d28d9;color:white;cursor:pointer";
    button.onclick = claimDaily;
    content.appendChild(button);

    const adButton = document.createElement("button");
    adButton.textContent = "▶ Watch Ad";
    adButton.style.cssText = "width:100%;margin:8px 0;padding:13px;border-radius:12px;border:1px solid #574481;background:#211638;color:white;cursor:pointer";
    adButton.onclick = async () => {
      if (typeof window.show_12022818 !== "function") {
        message("⚠️ Ad SDK is not ready. Please try again later.");
        return;
      }

      adButton.disabled = true;
      const originalText = adButton.textContent;

      try {
        message("Loading ad...");
        const ymid = crypto.randomUUID();

        // This identifier is useful only if the SDK supports these options
        // and the backend creates/matches a server-side ad session for it.
        const result = await window.show_12022818({
          ymid,
          requestVar: "daily_reward_ad"
        });

        if (result?.reward_event_type === "valued") {
          message("Ad event reported as valued. Waiting for server verification; no points have been credited.");
        } else {
          message("Ad event was not confirmed as valued. No points have been credited.");
        }
      } catch (e) {
        console.error("Monetag ad flow error:", e);
        message("Ad result could not be verified. No points have been credited.");
      } finally {
        adButton.disabled = false;
        adButton.textContent = originalText;
      }
    };
    content.appendChild(adButton);
    const note = document.createElement("p");
    note.className = "small";
    note.textContent = "Ad reward is not automatically added yet; verified Monetag postback is required.";
    content.appendChild(note);
  } else if (page === "friends") {
    content.innerHTML =
      "<h3>👥 Invite Friends</h3><p class='small'>Referral rewards need a referral system and your bot's username.</p>";
  } else if (page === "rank") {
    showLeaderboard(content);
  } else if (page === "profile") {
    const heading = document.createElement("h3");
    heading.textContent = "👤 Profile";
    const name = document.createElement("p");
    name.className = "small";
    name.textContent =
      "Name: " + (player?.username ||
        tg?.initDataUnsafe?.user?.first_name || "Player");
    const score = document.createElement("p");
    score.className = "small";
    score.textContent = "Points: " + points.toLocaleString();
    content.append(heading, name, score);
  }

  message("");
}

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

async function startApp() {
  render();

  if (!initData) {
    message("⚠️ Open this app inside Telegram to sign in.");
    $("content").innerHTML =
      "<h3>Welcome to Dropverse Point!</h3><p class='small'>Please open the Mini App from your Telegram bot.</p>";
    return;
  }

  try {
    await loadProfile(true);
    $("content").innerHTML =
      "<h3>Welcome to Dropverse Point!</h3><p class='small'>Your account is connected to the server.</p>";
  } catch (error) {
    isReady = false;
    render();
    message("⚠️ " + error.message);
  }
}

startApp();
</script>
</body>
</html>
